# Fuzzel — centered lower, caesar colors (matches alacritty/niri)
# bg #121113 · accent #734368 · gold #e6be6e · fg #d8d3cf

font=JetBrainsMono Nerd Font:size=13
dpi-aware=no

terminal=alacritty -e
prompt="󰍉  "
placeholder=search…
icon-theme=Papirus-Dark
icons-enabled=yes
image-size-ratio=0.6

fields=filename,name,generic
match-mode=fzf
sort-result=yes
match-counter=yes

# true center
anchor=center
lines=10
width=40
horizontal-pad=22
vertical-pad=14
inner-pad=10
line-height=26

layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=121113ff
text=e4dedaff
prompt=734368ff
placeholder=746e71ff
input=e4dedaff
match=e6be6eff
selection=231e28ff
selection-text=f7f4f1ff
selection-match=e6be6eff
counter=746e71ff
border=734368cc

[border]
width=2
radius=0

[dmenu]
exit-immediately-if-empty=yes
