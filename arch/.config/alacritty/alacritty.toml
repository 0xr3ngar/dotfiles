# Alacritty — caesar palette
# Colors: bg #121113 · accent purple #734368 · gold #e6be6e · fg #d8d3cf

[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
decorations = "Full"
opacity = 0.97
blur = false
dynamic_title = true
dynamic_padding = true
padding = { x = 16, y = 4 }
startup_mode = "Windowed"
option_as_alt = "Both"
title = "Terminal"

[scrolling]
history = 10000
multiplier = 3

[font]
size = 14.0
offset = { x = 0, y = 0 }
glyph_offset = { x = 0, y = 0 }
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[colors]
transparent_background_colors = false
draw_bold_text_with_bright_colors = false

[colors.primary]
background = "#121113"
foreground = "#e4deda"
dim_foreground = "#746e71"

[colors.cursor]
text = "#121113"
cursor = "#734368"

[colors.vi_mode_cursor]
text = "#121113"
cursor = "#e6be6e"

[colors.search.matches]
foreground = "#121113"
background = "#b88c42"

[colors.search.focused_match]
foreground = "#121113"
background = "#734368"

[colors.hints.start]
foreground = "#121113"
background = "#734368"

[colors.hints.end]
foreground = "#121113"
background = "#231e28"

[colors.selection]
text = "#d8d3cf"
background = "#231e28"

[colors.normal]
black   = "#0b0a0c"
red     = "#734368"
green   = "#4e6a57"
yellow  = "#b88c42"
blue    = "#4a535e"
magenta = "#53344c"
cyan    = "#3b586e"
white   = "#e4deda"

[colors.bright]
black   = "#746e71"
red     = "#e6be6e"
green   = "#749c81"
yellow  = "#e6be6e"
blue    = "#7d8898"
magenta = "#734368"
cyan    = "#648aa9"
white   = "#f7f4f1"

[colors.dim]
black   = "#060506"
red     = "#2e1a28"
green   = "#2e3f34"
yellow  = "#6e5730"
blue    = "#2e3338"
magenta = "#3a2136"
cyan    = "#233548"
white   = "#5c5659"

[cursor]
blink_interval = 750
unfocused_hollow = true
thickness = 0.15

[cursor.style]
shape = "Block"
blinking = "On"

[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Middle"
action = "Paste"

[bell]
animation = "EaseOutExpo"
duration = 0
color = "#734368"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[terminal]
osc52 = "CopyPaste"

[terminal.shell]
program = "/bin/zsh"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\n"
