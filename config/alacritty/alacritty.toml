# Alacritty — caesar palette
# Colors: bg #17151b · accent purple #77697d · gold #e6be6e · fg #d8d3cf

[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
decorations = "Full"
opacity = 0.97
blur = false
dynamic_title = true
dynamic_padding = true
padding = { x = 18, y = 14 }
startup_mode = "Windowed"
option_as_alt = "Both"
title = "Terminal"

[scrolling]
history = 10000
multiplier = 3

[font]
size = 14.0
offset = { x = 0, y = 0 }
glyph_offset = { x = 0, y = 0 }
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[colors]
transparent_background_colors = false
draw_bold_text_with_bright_colors = false

[colors.primary]
background = "#17151b"
foreground = "#e4deda"
dim_foreground = "#746e71"

[colors.cursor]
text = "#17151b"
cursor = "#e6be6e"

[colors.vi_mode_cursor]
text = "#17151b"
cursor = "#e6be6e"

[colors.search.matches]
foreground = "#17151b"
background = "#b88c42"

[colors.search.focused_match]
foreground = "#17151b"
background = "#e6be6e"

[colors.hints.start]
foreground = "#17151b"
background = "#e6be6e"

[colors.hints.end]
foreground = "#e4deda"
background = "#2b272f"

[colors.selection]
text = "#d8d3cf"
background = "#2b272f"

[colors.normal]
black   = "#100e13"
red     = "#e08060"
green   = "#8aaa91"
yellow  = "#d5ad68"
blue    = "#8e99a9"
magenta = "#b88bab"
cyan    = "#86a5ad"
white   = "#e4deda"

[colors.bright]
black   = "#746e71"
red     = "#ed9c83"
green   = "#a7c1a9"
yellow  = "#e6be6e"
blue    = "#b0bac8"
magenta = "#d4afc9"
cyan    = "#a5c4c9"
white   = "#f7f4f1"

[colors.dim]
black   = "#060506"
red     = "#2e1a28"
green   = "#2e3f34"
yellow  = "#6e5730"
blue    = "#2e3338"
magenta = "#3b3442"
cyan    = "#233548"
white   = "#5c5659"

[cursor]
blink_interval = 750
unfocused_hollow = true
thickness = 0.15

[cursor.style]
shape = "Block"
blinking = "On"

[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Middle"
action = "Paste"

[bell]
animation = "EaseOutExpo"
duration = 0
color = "#77697d"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[terminal]
osc52 = "CopyPaste"

[terminal.shell]
program = "/bin/zsh"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\n"
