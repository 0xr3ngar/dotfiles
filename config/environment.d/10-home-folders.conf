# Managed tool locations for GUI apps and user services.
XDG_CONFIG_HOME=$HOME/.config
XDG_CACHE_HOME=$HOME/.cache
XDG_DATA_HOME=$HOME/.local/share
XDG_STATE_HOME=$HOME/.local/state
BUN_INSTALL=$HOME/.local/share/bun
BUN_INSTALL_CACHE_DIR=$HOME/.cache/bun
CARGO_HOME=$HOME/.local/share/cargo
RUSTUP_HOME=$HOME/.local/share/rustup
ANDROID_USER_HOME=$HOME/.local/share/android
ANDROID_EMULATOR_HOME=$HOME/.local/share/android
ANDROID_AVD_HOME=$HOME/.local/share/android/avd
GRADLE_USER_HOME=$HOME/.cache/gradle
DOCKER_CONFIG=$HOME/.config/docker
GROK_HOME=$HOME/.local/share/grok
npm_config_cache=$HOME/.cache/npm
CUDA_CACHE_PATH=$HOME/.cache/nvidia/ComputeCache
__UNSAFE_EXPO_HOME_DIRECTORY=$HOME/.local/share/expo
PATH=${HOME}/.local/bin:${HOME}/.local/share/grok/bin:${HOME}/.local/share/bun/bin:${HOME}/.local/share/cargo/bin:${PATH}
