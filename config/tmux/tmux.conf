set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on
setw -g mode-keys vi
bind c new-window
bind , command-prompt -I "#W" "rename-window '%%'"
bind & kill-window
bind [ copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
if-shell 'command -v wl-copy >/dev/null 2>&1' 'bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"' 'bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"'
bind-key -T copy-mode-vi q send -X cancel
bind-key -T copy-mode-vi Escape send -X cancel

bind -n M-1 select-window -t 0
bind -n M-2 select-window -t 1
bind -n M-3 select-window -t 2
bind -n M-4 select-window -t 3
bind -n M-5 select-window -t 4
bind -n M-6 select-window -t 5
bind -n M-7 select-window -t 6
bind -n M-8 select-window -t 7
bind -n M-9 select-window -t 8
bind -n M-0 select-window -t 9

set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB"
set -g focus-events on

set -sg escape-time 10

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind S choose-session
bind N command-prompt -p "Session name:" "new-session -s '%%'"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
