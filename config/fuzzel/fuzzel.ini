# Caesar launcher. Palette matches config/theme/colors.json.

font=JetBrainsMono Nerd Font:pixelsize=16
dpi-aware=no
prompt="→  "
placeholder=launch
icon-theme=Papirus-Dark
icons-enabled=yes
terminal=alacritty -e
width=42
lines=10
horizontal-pad=22
vertical-pad=16
inner-pad=10
line-height=28
letter-spacing=0
scaling-filter=lanczos3
image-size-ratio=0
anchor=center
layer=overlay
match-counter=yes
match-mode=fzf
show-actions=yes

[colors]
background=17151bff
text=e4dedaff
prompt=e6be6eff
placeholder=746e71ff
input=e4dedaff
match=e6be6eff
selection=2b272fff
selection-text=e4dedaff
selection-match=e6be6eff
counter=9c9599ff
border=8c7c90ff

[border]
width=2
radius=12
selection-radius=8
